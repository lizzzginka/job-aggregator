{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Вход в систему</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="user_type" class="form-label">Тип пользователя</label>
                            <select class="form-select" id="user_type" name="user_type" required>
                                <option value="student">Студент</option>
                                <option value="university">Представитель университета</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="full_name" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required>
                        </div>

                        <div class="mb-3" id="login_group_field">
                            <label for="group_number" class="form-label">Номер группы</label>
                            <input type="text" class="form-control" id="group_number" name="group_number">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('user_type').addEventListener('change', function() {
        const userType = this.value;
        const groupField = document.getElementById('login_group_field');

        if (userType === 'student') {
            groupField.classList.remove('d-none');
            document.getElementById('group_number').required = true;
        } else {
            groupField.classList.add('d-none');
            document.getElementById('group_number').required = false;
        }
    });

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        const groupField = document.getElementById('login_group_field');
        if (document.getElementById('user_type').value !== 'student') {
            groupField.classList.add('d-none');
        }
    });
</script>
{% endblock %}
